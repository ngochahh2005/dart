name: recipeify
description: "Ứng dụng cho phép người dùng khám phá công thức nấu ăn từ khắp thế giới."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dio: ^5.11.0
  retrofit: ^4.9.2
  json_annotation: ^4.9.0
  logger: ^2.6.0
  freezed_annotation: ^3.0.0
  flutter_secure_storage: ^10.3.1
  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  path: ^1.9.1
  firebase_database: ^12.4.6
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^3.0.0
  retrofit_generator: ^10.2.7
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: k2d
      fonts:
        - asset: assets/fonts/K2D-Regular.ttf
        - asset: assets/fonts/K2D-Bold.ttf
          weight: 700